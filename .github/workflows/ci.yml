name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: web
      - name: Lint
        run: npm run lint
        working-directory: web
      - name: Unit tests
        run: npm test
        working-directory: web
      - name: Build
        run: npm run build
        working-directory: web

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: extension
      - name: Typecheck
        run: npm run typecheck
        working-directory: extension
      - name: Unit tests
        run: npm test
        working-directory: extension
      - name: Build and validate dist
        run: npm run build
        working-directory: extension
