<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      /* Saira ships with the extension so timers look the same as on the
         dashboard (it is not installed on most computers). */
      @font-face {
        font-family: "Saira";
        src: url("assets/saira.woff2") format("woff2");
        font-weight: 100 900;
      }
      :root {
        color-scheme: dark;
        --bg: #0a0a0a;
        --surface: #131313;
        --surface-2: #1c1c1c;
        --line: #2b2b2b;
        --fg: #f4f4f4;
        --muted: #9b9b9b;
        --accent: #ff5c8a;
        --accent-ink: #ff85a8;
        --ok: #34d65c;
        --warn: #f2d24b;
        --bad: #ff453a;
      }
      body {
        width: 260px;
        margin: 0;
        padding: 14px;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
        font-size: 13px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      header img {
        width: 22px;
        height: 22px;
        border-radius: 4px;
      }
      h1 {
        flex: 1;
        margin: 0;
        font-size: 15px;
        font-weight: 600;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: 12px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex: none;
      }
      .dot.ok {
        background: var(--ok);
      }
      .dot.warn {
        background: var(--warn);
      }
      .session {
        margin-top: 12px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
      }
      .session[hidden] {
        display: none;
      }
      #session-time {
        display: block;
        font-family: "Saira", -apple-system, "Segoe UI", sans-serif;
        font-weight: 600;
        font-size: 30px;
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
      }
      #session-label {
        color: var(--muted);
      }
      .idle {
        margin: 12px 0 0;
        color: var(--muted);
      }
      button {
        padding: 7px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface-2);
        color: var(--fg);
        font: inherit;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--muted);
      }
      #open-dashboard {
        margin-top: 12px;
        width: 100%;
        background: var(--accent);
        border-color: var(--accent);
        color: #000000;
        font-weight: 500;
      }
      #open-dashboard:hover {
        background: var(--accent-ink);
      }
      details {
        margin-top: 12px;
        border-top: 1px solid var(--line);
        padding-top: 10px;
      }
      summary {
        cursor: pointer;
        color: var(--muted);
        list-style: none;
      }
      summary::-webkit-details-marker {
        display: none;
      }
      summary::before {
        content: "";
        display: inline-block;
        width: 5px;
        height: 5px;
        margin: 0 8px 2px 1px;
        border-right: 1.5px solid var(--muted);
        border-bottom: 1.5px solid var(--muted);
        transform: rotate(-45deg);
        transition: transform 120ms;
      }
      details[open] summary::before {
        transform: rotate(45deg);
      }
      label {
        display: block;
        margin-top: 10px;
        color: var(--muted);
      }
      input[type="url"] {
        width: 100%;
        box-sizing: border-box;
        margin-top: 4px;
        padding: 7px 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--bg);
        color: var(--fg);
        font: inherit;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
      }
      #save-note {
        min-height: 14px;
        color: var(--muted);
      }
      #save-note.error {
        color: var(--bad);
      }
      #version {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/icon-128.png" alt="" />
      <h1>LockedIn</h1>
      <span class="status">
        <span id="status-dot" class="dot ok" aria-hidden="true"></span>
        <span id="status-text" role="status">Running</span>
      </span>
    </header>
    <div class="session" id="session-box" hidden>
      <span id="session-time" aria-live="polite">0:00</span>
      <span id="session-label"></span>
    </div>
    <p class="idle" id="idle-text">No session running.</p>
    <button id="open-dashboard" type="button">Open dashboard</button>
    <details id="settings">
      <summary>Settings</summary>
      <label for="dashboard-url">Dashboard URL</label>
      <input id="dashboard-url" type="url" placeholder="https://your-app.vercel.app" aria-label="Dashboard URL" />
      <div class="row">
        <button id="save-url" type="button">Save</button>
        <span id="save-note" aria-live="polite"></span>
      </div>
      <p id="version">v0.1.0</p>
    </details>
    <script src="popup.js"></script>
  </body>
</html>
